<svg width="500" height="240" viewBox="0 0 500 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Amir Hossein GitHub statistics">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: "Segoe UI", Ubuntu, Helvetica, Arial, sans-serif; }
      .num   { font-size: 30px; font-weight: 700; fill: #FFFFFF; }
      .label { font-size: 12.5px; font-weight: 500; fill: #8B949E; letter-spacing: .4px; }
      .title { font-size: 18px; font-weight: 700; fill: #FFFFFF; }
      .sub   { font-size: 12px; font-weight: 500; fill: #A78BFA; letter-spacing: 1.5px; }
    </style>
  </defs>

  <rect x="1" y="1" width="498" height="238" rx="18" fill="#0D1117" stroke="url(#cardStroke)" stroke-width="1.5"/>

  <g fill="#8B5CF6" opacity="0.10">
    <rect x="392" y="20" width="9" height="9" rx="2"/><rect x="405" y="20" width="9" height="9" rx="2"/><rect x="418" y="20" width="9" height="9" rx="2"/><rect x="431" y="20" width="9" height="9" rx="2"/><rect x="444" y="20" width="9" height="9" rx="2"/><rect x="457" y="20" width="9" height="9" rx="2"/>
    <rect x="392" y="33" width="9" height="9" rx="2"/><rect x="405" y="33" width="9" height="9" rx="2"/><rect x="418" y="33" width="9" height="9" rx="2"/><rect x="431" y="33" width="9" height="9" rx="2"/><rect x="444" y="33" width="9" height="9" rx="2"/><rect x="457" y="33" width="9" height="9" rx="2"/>
    <rect x="405" y="46" width="9" height="9" rx="2"/><rect x="418" y="46" width="9" height="9" rx="2"/><rect x="444" y="46" width="9" height="9" rx="2"/><rect x="457" y="46" width="9" height="9" rx="2"/>
  </g>

  <circle cx="36" cy="38" r="6" fill="url(#accent)" filter="url(#glow)"/>
  <text x="52" y="36" class="title">Amir Hossein</text>
  <text x="52" y="52" class="sub">GITHUB STATISTICS</text>
  <line x1="28" y1="70" x2="472" y2="70" stroke="#21262D" stroke-width="1"/>

  <!-- Total Stars -->
  <g transform="translate(40,98)">
    <path d="M11 1.5l2.6 5.6 6.1.7-4.5 4.2 1.2 6L11 18.9 5.1 22l1.2-6L1.8 7.8l6.1-.7z" fill="none" stroke="url(#accent)" stroke-width="1.6" stroke-linejoin="round" transform="translate(0,2) scale(0.95)"/>
    <text x="34" y="14" class="num">5</text>
    <text x="35" y="34" class="label">Total Stars</text>
  </g>

  <!-- Total Commits -->
  <g transform="translate(270,98)">
    <circle cx="11" cy="13" r="5.5" fill="none" stroke="url(#accent)" stroke-width="1.6"/>
    <line x1="11" y1="2" x2="11" y2="7.5" stroke="url(#accent)" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="11" y1="18.5" x2="11" y2="24" stroke="url(#accent)" stroke-width="1.6" stroke-linecap="round"/>
    <text x="34" y="14" class="num">27</text>
    <text x="35" y="34" class="label">Total Commits</text>
  </g>

  <!-- Total Repositories -->
  <g transform="translate(40,168)">
    <path d="M4 2.5h11a2 2 0 0 1 2 2V22l-5-3-5 3V4.5a2 2 0 0 0-2-2H4z" fill="none" stroke="url(#accent)" stroke-width="1.6" stroke-linejoin="round" transform="scale(0.95)"/>
    <text x="34" y="14" class="num">10</text>
    <text x="35" y="34" class="label">Total Repositories</text>
  </g>

  <!-- Total Contributions -->
  <g transform="translate(270,168)">
    <g fill="url(#accent)">
      <rect x="2" y="4" width="5" height="5" rx="1.2"/><rect x="9" y="4" width="5" height="5" rx="1.2"/><rect x="16" y="4" width="5" height="5" rx="1.2"/>
      <rect x="2" y="11" width="5" height="5" rx="1.2"/><rect x="9" y="11" width="5" height="5" rx="1.2"/><rect x="16" y="11" width="5" height="5" rx="1.2"/>
      <rect x="2" y="18" width="5" height="5" rx="1.2"/><rect x="9" y="18" width="5" height="5" rx="1.2"/><rect x="16" y="18" width="5" height="5" rx="1.2"/>
    </g>
    <text x="34" y="14" class="num">135</text>
    <text x="35" y="34" class="label">Total Contributions</text>
  </g>
</svg>
